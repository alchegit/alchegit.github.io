<body>
  <header class="site-header">
    <a class="brand" href="/storyheaven/"><span class="brand-mark">S</span><span><strong>StoryHeaven</strong><small>연재 작품 관리</small></span></a>
    <nav class="main-nav" aria-label="관리자 메뉴"><a href="/storyheaven/operator/">검수</a><a href="/storyheaven/operator/serial/">자동 연재 설정</a><a href="/storyheaven/operator/serial/stories/" aria-current="page">연재 작품 관리</a><a href="/webtoon/operator/">회원 관리</a></nav>
    <div class="account-actions"><span class="user-chip" data-common-user hidden></span><button class="button" type="button" data-common-login>관리자 로그인</button><button class="icon-button" type="button" data-common-logout hidden aria-label="로그아웃">↪</button></div>
  </header>

  <main>
    <header class="page-hero works-hero">
      <div><p class="eyebrow">PRIVATE SERIAL LIBRARY</p><h1>연재 중인 작품을<br>한곳에서 조정합니다.</h1><p>작품별 공개 범위와 다음 화 제작 방식을 나누어 관리합니다. 비공개와 일시 정지는 원고를 지우지 않습니다.</p></div>
      <div class="engine-state" data-engine-state>연결 확인 중</div>
    </header>

    <div class="page-shell works-shell">
      <section class="gate" data-access-gate>
        <h2>관리자 확인이 필요합니다.</h2>
        <p>로그인하면 서버에서 관리자 권한을 다시 확인합니다.</p>
        <button class="button" type="button" data-common-login>관리자 로그인</button>
      </section>

      <section class="works-dashboard" data-works-dashboard hidden>
        <section class="summary-strip" aria-label="연재 작품 요약">
          <div><span>전체</span><strong data-summary-total>0</strong></div>
          <div><span class="help-topic"><span>공개</span><button class="help-button" type="button" data-help data-help-title="공개 작품" data-help-body="독자 목록과 작품 상세에서 볼 수 있는 작품 수입니다. 비공개나 보관으로 바꾸면 독자 목록에서 숨겨집니다.">?</button></span><strong data-summary-public>0</strong></div>
          <div><span class="help-topic"><span>멈춤·종료</span><button class="help-button" type="button" data-help data-help-title="멈춤·종료" data-help-body="일시 정지는 다음 화 제작만 잠시 멈춘 상태입니다. 연재 종료는 추천이 늘어도 더 이상 자동으로 다음 화를 만들지 않는 상태입니다.&#10;&#10;둘 다 기존 원고와 기록을 삭제하지 않습니다.">?</button></span><strong data-summary-stopped>0</strong></div>
          <div><span class="help-topic"><span>공개 전 회차</span><button class="help-button" type="button" data-help data-help-title="공개 전 회차" data-help-body="원고 제작과 검수는 끝났지만 아직 독자에게 공개되지 않은 회차입니다.&#10;&#10;자동 공개 설정이면 순서와 조건에 맞춰 공개되고, 테스트 비공개나 수동 관리 중이면 운영자가 확인한 뒤 처리합니다.">?</button></span><strong data-summary-ready>0</strong></div>
        </section>

        <section class="work-tools" aria-label="작품 검색과 필터">
          <label class="search-field"><span>작품 검색</span><input type="search" maxlength="80" placeholder="제목이나 장르" data-story-search></label>
          <label><span class="help-topic"><span>공개 상태</span><button class="help-button" type="button" data-help data-help-title="공개 상태" data-help-body="공개는 독자가 볼 수 있는 상태입니다. 비공개는 독자 목록에서 숨기지만 기록과 원고는 남깁니다. 보관은 운영 정리용 상태이며 다음 화 제작도 종료됩니다.">?</button></span><select data-visibility-filter><option value="all">전체</option><option value="public">공개</option><option value="private">비공개</option><option value="archived">보관</option></select></label>
          <label><span class="help-topic"><span>연재 방식</span><button class="help-button" type="button" data-help data-help-title="연재 방식" data-help-body="추천 자동은 최신 화 추천 11개가 모이면 다음 화 제작을 요청합니다. 운영자 요청은 버튼을 눌렀을 때만 다음 화를 만듭니다.&#10;&#10;일시 정지는 잠깐 멈춤, 연재 종료는 더 이상 이어 쓰지 않겠다는 운영 결정입니다.">?</button></span><select data-continuation-filter><option value="all">전체</option><option value="auto">추천 자동</option><option value="manual">운영자 요청</option><option value="paused">일시 정지</option><option value="ended">연재 종료</option></select></label>
          <button class="button secondary refresh-button" type="button" data-refresh>새로고침</button>
        </section>

        <div class="list-heading"><div><p class="eyebrow">SERIALS</p><h2><span class="help-topic"><span>작품 목록</span><button class="help-button" type="button" data-help data-help-title="작품 목록" data-help-body="작품별 공개 상태, 다음 화 제작 방식, 조회·추천·공개 전 회차를 한 번에 확인하는 운영 목록입니다.&#10;&#10;설정 저장은 공개 범위와 다음 화 제작 방식만 바꾸며, 원고 자체를 삭제하지 않습니다.">?</button></span></h2></div><p data-result-count>0편</p></div>
        <section class="managed-list" data-managed-list aria-live="polite"></section>
      </section>
    </div>
